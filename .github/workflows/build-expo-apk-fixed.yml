name: Build Expo Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          ls -la
          ZIP=$(find . -maxdepth 1 -type f \( \
            -iname '*Phase1*.zip' -o \
            -iname '*FULL*.zip' -o \
            -iname '*Gram-Panchayat*.zip' -o \
            -iname '*cashbook*.zip' -o \
            -iname '*MVP*.zip' -o \
            -iname '*source*.zip' \
          \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP in repo root."
            exit 1
          fi

          echo "ZIP=$ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -f extracted/cashbook-mobile/package.json ]; then
            PROJECT_DIR=extracted/cashbook-mobile
          elif [ -f extracted/package.json ] && [ -f extracted/app.json ]; then
            PROJECT_DIR=extracted
          else
            PROJECT_DIR=$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found"
            find extracted -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package.json

      - name: Enable pnpm
        run: |
          set -e
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Sanitize package.json
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node sanitize-pkg.js || node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const CATALOG = {
            '@tanstack/react-query': '^5.62.8',
            'zod': '^3.24.1'
          };
          const REMOVE = new Set([
            'expo-document-picker',
            'expo-file-system',
            'expo-sharing',
            'expo-local-authentication'
          ]);
          function fix(deps) {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (REMOVE.has(name)) continue;
              if (ver.startsWith('workspace:') || name.startsWith('@workspace/')) continue;
              if (ver === 'catalog:' || ver.startsWith('catalog:')) {
                out[name] = CATALOG[name] || 'latest';
                continue;
              }
              out[name] = ver;
            }
            return out;
          }
          pkg.dependencies = fix(pkg.dependencies);
          pkg.devDependencies = fix(pkg.devDependencies);
          delete pkg.packageManager;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('package.json sanitized');
          NODE

      - name: Install JS deps
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          pnpm install --no-frozen-lockfile || npm install

      # Align all Expo/RN packages with the Expo SDK in package.json.
      # This also fixes the old babel-preset-expo ~54 entry in this source.
      - name: Align Expo SDK 57 dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npx expo install --fix
          npx expo install babel-preset-expo react-native-reanimated react-native-worklets react-native-screens react-native-safe-area-context react-native-gesture-handler
          node -e "const p=require('./package.json'); console.log('expo=',p.dependencies?.expo,'react-native=',p.dependencies?.['react-native'],'reanimated=',p.dependencies?.['react-native-reanimated'],'worklets=',p.dependencies?.['react-native-worklets'],'screens=',p.dependencies?.['react-native-screens'],'babel-preset-expo=',p.devDependencies?.['babel-preset-expo'])"

      - name: Write Expo-compatible Babel config
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          cat > babel.config.js <<'EOF'
          module.exports = function (api) {
            api.cache(true);
            return {
              presets: ['babel-preset-expo'],
            };
          };
          EOF
          cat babel.config.js

      - name: Force New Architecture for SDK 57
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo = app.expo || {};
          delete app.expo.newArchEnabled;
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('Removed newArchEnabled=false; SDK 57 requires New Architecture.');
          NODE

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools cmdline-tools.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Expo prebuild (android)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf android
          npx expo prebuild --platform android --clean --no-install
          if [ -f android/gradle.properties ]; then
            # SDK 57 / RN 0.86: do NOT disable New Architecture.
            sed -i '/^[[:space:]]*newArchEnabled[[:space:]]*=/d' android/gradle.properties || true
          fi
          ls -la android

      - name: Re-install after prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          pnpm install --no-frozen-lockfile || npm install

      - name: Check Expo project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npx expo-doctor@latest || true

      - name: Debug keystore
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore debug-release.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GP Cashbook,O=GP,C=IN"

      - name: Assemble RELEASE APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/debug-release.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --stacktrace --info --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          find . -name "*.apk" -type f -print || true

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          APK=$(find . -path "*/outputs/apk/*" -name "*.apk" -type f | grep -E "release" | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "No APK"
            tail -n 160 "$GITHUB_WORKSPACE/gradle-build.log" || true
            exit 1
          fi
          cp -v "$APK" "$GITHUB_WORKSPACE/apk-out/gram-panchayat-cashbook.apk"
          ls -la "$GITHUB_WORKSPACE/apk-out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-panchayat-cashbook-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            ${{ github.workspace }}/gradle-build.log
            ${{ env.PROJECT_DIR }}/android/**/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
