name: Build Expo Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          ls -la

          ZIP=$(find . -maxdepth 1 -type f \( \
            -iname '*Phase1*.zip' -o \
            -iname '*FULL*.zip' -o \
            -iname '*Gram-Panchayat*.zip' -o \
            -iname '*cashbook*.zip' -o \
            -iname '*MVP*.zip' -o \
            -iname '*source*.zip' \
          \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP in repo root."
            exit 1
          fi
          echo "ZIP=$ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -f extracted/cashbook-mobile/package.json ]; then
            PROJECT_DIR=extracted/cashbook-mobile
          elif [ -f extracted/package.json ] && [ -f extracted/app.json ]; then
            PROJECT_DIR=extracted
          else
            PROJECT_DIR=$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found"
            find extracted -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Sanitize package.json
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node sanitize-pkg.js || node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const CATALOG = {
            '@tanstack/react-query': '^5.62.8',
            'zod': '^3.24.1',
          };
          const REMOVE = new Set([
            'expo-document-picker',
            'expo-file-system',
            'expo-sharing',
            'expo-local-authentication',
          ]);
          function fix(deps) {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (REMOVE.has(name)) continue;
              if (ver.startsWith('workspace:') || name.startsWith('@workspace/')) continue;
              if (ver === 'catalog:' || ver.startsWith('catalog:')) {
                out[name] = CATALOG[name] || 'latest';
                continue;
              }
              out[name] = ver;
            }
            return out;
          }
          pkg.dependencies = fix(pkg.dependencies);
          pkg.devDependencies = fix(pkg.devDependencies);
          delete pkg.packageManager;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('package.json sanitized');
          NODE

      - name: Install JS deps
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          pnpm install --no-frozen-lockfile || npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools cmdline-tools.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Ensure babel + app.json flags
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          printf '%s\n' \
            "module.exports = function (api) {" \
            "  api.cache(true);" \
            "  return {" \
            "    presets: ['babel-preset-expo']," \
            "    plugins: ['react-native-reanimated/plugin']," \
            "  };" \
            "};" \
            > babel.config.js
          cat babel.config.js

          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo = app.expo || {};
            app.expo.newArchEnabled = false;
            app.expo.android = Object.assign({}, app.expo.android, {
              package: "com.grampanchayat.cashbook"
            });
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("newArchEnabled=false");
          '

          pnpm add -D babel-preset-expo || npm install -D babel-preset-expo

      - name: Expo prebuild (android)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npx expo prebuild --platform android --clean --no-install
          if [ -f android/gradle.properties ]; then
            sed -i 's/newArchEnabled=true/newArchEnabled=false/g' android/gradle.properties || true
            grep -i newArch android/gradle.properties || true
          fi
          ls -la android

      - name: Re-install after prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const CATALOG = { "@tanstack/react-query": "^5.62.8", "zod": "^3.24.1" };
            const REMOVE = new Set(["expo-document-picker","expo-file-system","expo-sharing","expo-local-authentication"]);
            function fix(deps) {
              if (!deps) return deps;
              const out = {};
              for (const [name, ver] of Object.entries(deps)) {
                if (typeof ver !== "string") continue;
                if (REMOVE.has(name)) continue;
                if (ver.startsWith("workspace:") || name.startsWith("@workspace/")) continue;
                if (ver.startsWith("catalog:")) { out[name] = CATALOG[name] || "latest"; continue; }
                out[name] = ver;
              }
              return out;
            }
            pkg.dependencies = fix(pkg.dependencies);
            pkg.devDependencies = fix(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          pnpm install --no-frozen-lockfile || npm install

      - name: Debug keystore
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore debug-release.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GP Cashbook,O=GP,C=IN"

      - name: Assemble RELEASE APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/debug-release.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --stacktrace --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          find . -name "*.apk" -type f -print || true

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          APK=$(find . -path "*/outputs/apk/*" -name "*.apk" -type f | grep -E "release" | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "No APK"
            tail -n 120 "$GITHUB_WORKSPACE/gradle-build.log" || true
            exit 1
          fi
          cp -v "$APK" "$GITHUB_WORKSPACE/apk-out/gram-panchayat-cashbook.apk"
          ls -la "$GITHUB_WORKSPACE/apk-out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-panchayat-cashbook-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            ${{ github.workspace }}/gradle-build.log
            ${{ env.PROJECT_DIR }}/android/**/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
