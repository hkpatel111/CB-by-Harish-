name: Build APK (Gram Panchayat Cashbook v7)

# Chalane ka tarika:
#   GitHub → Actions → "Build APK (Gram Panchayat Cashbook v7)" → Run workflow
# ya tag push karo: git tag v7 && git push origin v7
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Zip ke andar poori project hoti hai (app/, context/, types/, services/,
      # package.json, package-lock.json, configs). node_modules kabhi zip me nahi.
      - name: Extract source zip
        run: |
          ZIP=./Gram-Panchayat-Cashbook-FULL-v7.zip
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found. Repo root par rakha ho:"
            ls -la
            exit 1
          fi
          # unzip warning (exit 1) par bhi ruk na jaye — sirf asli error (code > 1) fail kare
          set +e
          unzip -q -o "$ZIP" -d extracted
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "unzip failed with code $code"
            exit "$code"
          fi
          echo "Contents:"
          ls -la extracted/cashbook-mobile

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extracted/cashbook-mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: extracted/cashbook-mobile
        run: npm ci --no-audit --no-fund

      # Typecheck fail-fast — galat code par Gradle me time waste nahi
      - name: Typecheck (fail fast)
        working-directory: extracted/cashbook-mobile
        run: npm run typecheck

      # Managed workflow hai (android/ folder zip me nahi) — prebuild se Gradle project banta hai
      - name: Generate android project (expo prebuild)
        working-directory: extracted/cashbook-mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install -y

      # Java/gradle cache prebuild ke BAAD — tabhi android/ gradle files exist karti hain.
      # (Pehle checkout ke waqt rakhne par setup-java cache path dhoondh kar fail ho jata:
      #  "No file matched to **/*.gradle*")
      - name: Setup Java 17 (Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            extracted/cashbook-mobile/android/**/gradle-wrapper.properties
            extracted/cashbook-mobile/android/**/*.gradle
            extracted/cashbook-mobile/android/**/*.gradle.kts

      - name: Build release APK
        working-directory: extracted/cashbook-mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp extracted/cashbook-mobile/android/app/build/outputs/apk/release/*.apk out/GramPanchayatCashbook.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: GramPanchayatCashbook-APK
          path: out/GramPanchayatCashbook.apk
          if-no-files-found: error
          retention-days: 30
