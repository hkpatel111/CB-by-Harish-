name: Cashbook Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build:
    name: Build and collect APK/logs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check project files
        run: |
          pwd
          find . -maxdepth 3 -type f | sort
          java -version

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean --stacktrace 2>&1 | tee clean.log

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Run unit tests if available
        run: ./gradlew test --stacktrace 2>&1 | tee test.log
        continue-on-error: true

      - name: Collect diagnostic information
        if: always()
        run: |
          mkdir -p diagnostics
          cp -f clean.log build.log test.log diagnostics/ 2>/dev/null || true
          ./gradlew --version > diagnostics/gradle-version.txt 2>&1 || true
          java -version > diagnostics/java-version.txt 2>&1 || true
          find app/build/outputs -type f -maxdepth 6 -print > diagnostics/output-files.txt 2>&1 || true
          find . -name "*.log" -not -path "./.git/*" -exec cp --parents {} diagnostics/ \; 2>/dev/null || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-build-logs-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
          
