name: Build Expo Debug APK

# Source ZIP: Gram-Panchayat-Cashbook-Android-MVP.zip (Expo / React Native)
# Flow: extract → sanitize package.json → pnpm install → expo prebuild --no-install
#       → re-install if needed → gradle assembleDebug

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          echo "== Repository root =="
          ls -la

          ZIP=$(find . -maxdepth 1 -type f \( \
            -iname '*Gram-Panchayat*.zip' -o \
            -iname '*cashbook*.zip' -o \
            -iname '*source*.zip' -o \
            -iname '*MVP*.zip' \
          \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi
          echo "Found ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -f extracted/cashbook-mobile/package.json ]; then
            PROJECT_DIR=extracted/cashbook-mobile
          elif [ -f extracted/package.json ] && [ -f extracted/app.json ]; then
            PROJECT_DIR=extracted
          else
            PROJECT_DIR=$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: Could not locate Expo project (package.json)."
            find extracted -type f | head -60
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Make package.json CI-friendly (strip monorepo-only deps)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));

          const strip = (deps) => {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (ver.startsWith('workspace:') || ver.startsWith('catalog:')) {
                console.log(`Removing monorepo-only dep: ${name}@${ver}`);
                continue;
              }
              out[name] = ver;
            }
            return out;
          };

          pkg.dependencies = strip(pkg.dependencies);
          pkg.devDependencies = strip(pkg.devDependencies);
          delete pkg.packageManager;

          pkg.scripts = pkg.scripts || {};
          if (!pkg.scripts['android']) {
            pkg.scripts['android'] = 'expo run:android';
          }

          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          console.log('package.json sanitized for standalone CI install');
          NODE

      - name: Install JS dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile || npm install
          else
            pnpm install || npm install
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools + SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools cmdline-tools.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          sdkmanager --list_installed | head -30

      - name: Expo prebuild (generate android/ — no interactive install)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # --no-install: do not prompt to install updated deps after rewriting package.json
          # CI=1 already set in job env
          npx expo prebuild --platform android --clean --no-install
          ls -la android

      - name: Re-install deps after prebuild (package.json may have changed)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # Strip monorepo markers again if prebuild rewrote package.json
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          if (!fs.existsSync(pkgPath)) process.exit(0);
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const strip = (deps) => {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (ver.startsWith('workspace:') || ver.startsWith('catalog:')) continue;
              out[name] = ver;
            }
            return out;
          };
          pkg.dependencies = strip(pkg.dependencies);
          pkg.devDependencies = strip(pkg.devDependencies);
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile || npm install
          else
            pnpm install || npm install
          fi

      - name: Build debug APK with Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "== APK search =="
          find . -name "*.apk" -type f

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-panchayat-cashbook-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-build-logs
          path: |
            ${{ env.PROJECT_DIR }}/android/**/build/reports/**
            ${{ env.PROJECT_DIR }}/android/**/build/outputs/**
          retention-days: 7
          if-no-files-found: ignore
          
