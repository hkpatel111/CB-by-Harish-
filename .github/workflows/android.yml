name: Cashbook Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Show repository structure
        run: |
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Intentionally no cache: gradle here. It fails when Gradle wrapper files
          # are absent. Caching is optional and can be added after wrapper is committed.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -x ./gradlew || chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Run tests if available
        run: ./gradlew test --no-daemon --stacktrace 2>&1 | tee test.log
        continue-on-error: true

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp -f build.log test.log diagnostics/ 2>/dev/null || true
          java -version > diagnostics/java-version.txt 2>&1 || true
          ./gradlew --version > diagnostics/gradle-version.txt 2>&1 || true
          find app/build/outputs -type f -print > diagnostics/output-files.txt 2>&1 || true
          find . -name '*.log' -not -path './.git/*' -exec cp --parents {} diagnostics/ \; 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-build-logs-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
          
