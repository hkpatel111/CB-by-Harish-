name: Cashbook Android Build (self bootstrapping)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate Android project
        shell: bash
        run: |
          set -euxo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          find . -maxdepth 4 -type f | sort
          test -f settings.gradle.kts || test -f settings.gradle || (echo "settings.gradle(.kts) नहीं मिला; ZIP की files repository root में extract करें"; exit 1)
          test -f build.gradle.kts || test -f build.gradle || (echo "root build.gradle(.kts) नहीं मिला"; exit 1)
          test -d app || (echo "app folder नहीं मिला"; exit 1)
          test -f app/build.gradle.kts || test -f app/build.gradle || (echo "app/build.gradle(.kts) नहीं मिला"; exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Install Gradle directly
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build debug APK without wrapper
        shell: bash
        run: |
          set -o pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Run tests if available
        shell: bash
        run: |
          set -o pipefail
          gradle test --no-daemon --stacktrace 2>&1 | tee test.log
        continue-on-error: true

      - name: Collect logs and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp -f build.log test.log diagnostics/ 2>/dev/null || true
          java -version > diagnostics/java-version.txt 2>&1 || true
          gradle --version > diagnostics/gradle-version.txt 2>&1 || true
          find . -maxdepth 5 -type f | sort > diagnostics/repository-files.txt 2>&1 || true
          find app/build/outputs -type f -print > diagnostics/apk-output-files.txt 2>&1 || true
          find . -name '*.log' -not -path './.git/*' -exec cp --parents {} diagnostics/ \; 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-build-logs-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
          
