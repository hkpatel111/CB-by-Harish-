name: Cashbook Android Build - Auto Extract ZIP

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euxo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Repository root में कोई ZIP नहीं मिली"
            exit 1
          fi
          zip_file="${zips[0]}"
          echo "Using ZIP: $zip_file"
          rm -rf _source
          mkdir -p _source
          unzip -q -o "$zip_file" -d _source
          echo "Extracted files:"
          find _source -maxdepth 6 -type f | sort

          # ZIP में root folder हो या direct files, दोनों cases संभालें
          project_dir=""
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if [ -f "$candidate/build.gradle.kts" ] || [ -f "$candidate/build.gradle" ]; then
              if [ -d "$candidate/app" ]; then project_dir="$candidate"; break; fi
            fi
          done < <(find _source -type f \( -name settings.gradle.kts -o -name settings.gradle \))

          if [ -z "$project_dir" ]; then
            echo "ZIP में valid Android Gradle project नहीं मिला"
            echo "Expected: settings.gradle(.kts), build.gradle(.kts), app/"
            exit 1
          fi

          echo "Project directory: $project_dir"
          cp -a "$project_dir"/. .

      - name: Locate project after extraction
        shell: bash
        run: |
          set -euxo pipefail
          find . -maxdepth 4 -type f -not -path './.git/*' | sort
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Run tests if available
        shell: bash
        run: |
          set -o pipefail
          gradle test --no-daemon --stacktrace 2>&1 | tee test.log
        continue-on-error: true

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp -f build.log test.log diagnostics/ 2>/dev/null || true
          java -version > diagnostics/java-version.txt 2>&1 || true
          gradle --version > diagnostics/gradle-version.txt 2>&1 || true
          find . -maxdepth 7 -type f -not -path './.git/*' | sort > diagnostics/repository-files.txt 2>&1 || true
          find app/build/outputs -type f -print > diagnostics/apk-output-files.txt 2>&1 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-build-logs-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
          
