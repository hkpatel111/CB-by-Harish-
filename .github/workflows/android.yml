name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          echo "Looking for source ZIP in repository root..."
          ls -la

          ZIP=$(find . -maxdepth 1 -type f \( -iname '*cashbook*.zip' -o -iname '*source*.zip' \) | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No Cashbook/source ZIP found in repository root."
            exit 1
          fi
          echo "Found ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          echo "Extracted contents:"
          find extracted -maxdepth 3 -type d | head -40

          # Project root may be extracted/CashbookApp or extracted/ itself
          if [ -f extracted/settings.gradle.kts ] || [ -f extracted/settings.gradle ]; then
            PROJECT_DIR=extracted
          elif [ -f extracted/CashbookApp/settings.gradle.kts ] || [ -f extracted/CashbookApp/settings.gradle ]; then
            PROJECT_DIR=extracted/CashbookApp
          else
            # Fallback: first folder that contains settings.gradle*
            PROJECT_DIR=$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate Android project root after extraction."
            find extracted -type f | head -50
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Do NOT enable gradle cache here — wrapper jar is not committed (see README)

      - name: Grant execute permission for gradlew (if present)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "No gradlew yet — will generate wrapper after Gradle is available."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Generate wrapper if missing; project only ships gradle-wrapper.properties
          cache-disabled: true

      - name: Ensure Gradle wrapper exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper (gradle-wrapper.jar was not in the ZIP)..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "Build finished. Looking for APK..."
          find . -name "*.apk" -type f

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cashbook-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.PROJECT_DIR }}/**/build/reports/**
            ${{ env.PROJECT_DIR }}/**/build/outputs/**
          retention-days: 7
          if-no-files-found: ignore
