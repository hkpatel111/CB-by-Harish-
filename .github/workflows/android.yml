kind = "mobile"
previewPath = "/"
title = "Gram Panchayat Cashbook"
description = "An offline-first Android cashbook for gram panchayat finance teams. Tracks income, expenses, dynamic fund balances, 30-line cashbook pages, and financial-year summaries with a clear Hindi-first workflow."
version = "1.0.0"
id = "artifacts/cashbook-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26049

[services.development]
run = "pnpm --filter @workspace/cashbook-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cashbook-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cashbook-mobile", "run", "serve" ]

[services.env]
PORT = "26049"
BASE_PATH = "/"
