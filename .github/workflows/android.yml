name: Build Expo Standalone APK

# Source ZIP at repo root (Expo / React Native).
# Builds a sideloadable APK with JS bundle embedded (no Metro required).
#
# Strategy:
#   1. expo prebuild → android/
#   2. Explicitly bundle JS into android/app/src/main/assets/index.android.bundle
#   3. assembleDebug (debug keystore, installs easily; bundle already in assets)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          ls -la

          ZIP=$(find . -maxdepth 1 -type f \( \
            -iname '*Gram-Panchayat*.zip' -o \
            -iname '*cashbook*.zip' -o \
            -iname '*source*.zip' -o \
            -iname '*MVP*.zip' \
          \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi
          echo "Found ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -f extracted/cashbook-mobile/package.json ]; then
            PROJECT_DIR=extracted/cashbook-mobile
          elif [ -f extracted/package.json ] && [ -f extracted/app.json ]; then
            PROJECT_DIR=extracted
          else
            PROJECT_DIR=$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: Could not locate Expo project (package.json)."
            find extracted -type f | head -60
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Sanitize package.json (strip monorepo-only deps)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const strip = (deps) => {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (ver.startsWith('workspace:') || ver.startsWith('catalog:')) {
                console.log('Removing:', name, ver);
                continue;
              }
              out[name] = ver;
            }
            return out;
          };
          pkg.dependencies = strip(pkg.dependencies);
          pkg.devDependencies = strip(pkg.devDependencies);
          delete pkg.packageManager;
          pkg.scripts = pkg.scripts || {};
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install JS dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          pnpm install --no-frozen-lockfile || npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (no obsolete tools package)
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools cmdline-tools.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Expo prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npx expo prebuild --platform android --clean --no-install
          ls -la android

      - name: Re-install deps after prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const strip = (deps) => {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (ver.startsWith('workspace:') || ver.startsWith('catalog:')) continue;
              out[name] = ver;
            }
            return out;
          };
          pkg.dependencies = strip(pkg.dependencies);
          pkg.devDependencies = strip(pkg.devDependencies);
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile || npm install

      # Embed JS so the APK does not need Metro (fixes red "Unable to load script" screen)
      - name: Bundle JS into android assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p android/app/src/main/assets

          ENTRY=$(node -e "const p=require('./package.json'); console.log(p.main || 'node_modules/expo/AppEntry.js')")
          echo "Entry file: $ENTRY"

          # Prefer expo export pipeline when available; fall back to react-native CLI bundle
          if npx expo export --help 2>&1 | grep -q -- '--platform'; then
            echo "Trying expo export for android assets..."
            # Still use classic bundle for assets path that RN debug loads
            true
          fi

          npx react-native bundle \
            --platform android \
            --dev false \
            --minify true \
            --entry-file "$ENTRY" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache

          ls -la android/app/src/main/assets/
          # Sanity: bundle must not be empty
          test -s android/app/src/main/assets/index.android.bundle

      - name: Build debug APK (with embedded bundle)
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          echo "== APK files =="
          find . -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-panchayat-cashbook-standalone-apk
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            ${{ github.workspace }}/gradle-build.log
            ${{ env.PROJECT_DIR }}/android/**/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
          
