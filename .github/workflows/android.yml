name: Build Expo Standalone APK

# Source ZIP: Gram-Panchayat-Cashbook-Android-MVP.zip (Expo / React Native)
# Produces a RELEASE APK with JS bundle embedded (works offline, no Metro).
# Release is signed with the Android debug keystore so it installs without a custom keystore.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          echo "== Repository root =="
          ls -la

          ZIP=$(find . -maxdepth 1 -type f \( \
            -iname '*Gram-Panchayat*.zip' -o \
            -iname '*cashbook*.zip' -o \
            -iname '*source*.zip' -o \
            -iname '*MVP*.zip' \
          \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi
          echo "Found ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -f extracted/cashbook-mobile/package.json ]; then
            PROJECT_DIR=extracted/cashbook-mobile
          elif [ -f extracted/package.json ] && [ -f extracted/app.json ]; then
            PROJECT_DIR=extracted
          else
            PROJECT_DIR=$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: Could not locate Expo project (package.json)."
            find extracted -type f | head -60
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Make package.json CI-friendly (strip monorepo-only deps)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));

          const strip = (deps) => {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (ver.startsWith('workspace:') || ver.startsWith('catalog:')) {
                console.log(`Removing monorepo-only dep: ${name}@${ver}`);
                continue;
              }
              out[name] = ver;
            }
            return out;
          };

          pkg.dependencies = strip(pkg.dependencies);
          pkg.devDependencies = strip(pkg.devDependencies);
          delete pkg.packageManager;

          pkg.scripts = pkg.scripts || {};
          if (!pkg.scripts['android']) {
            pkg.scripts['android'] = 'expo run:android';
          }

          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          console.log('package.json sanitized for standalone CI install');
          NODE

      - name: Install JS dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile || npm install
          else
            pnpm install || npm install
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools + SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools cmdline-tools.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          sdkmanager --list_installed | head -30

      - name: Expo prebuild (generate android/ — no interactive install)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npx expo prebuild --platform android --clean --no-install
          ls -la android

      - name: Re-install deps after prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          if (!fs.existsSync(pkgPath)) process.exit(0);
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const strip = (deps) => {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (ver.startsWith('workspace:') || ver.startsWith('catalog:')) continue;
              out[name] = ver;
            }
            return out;
          };
          pkg.dependencies = strip(pkg.dependencies);
          pkg.devDependencies = strip(pkg.devDependencies);
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile || npm install
          else
            pnpm install || npm install
          fi

      # Critical: debug APK does NOT embed JS (expects Metro).
      # Release APK embeds index.android.bundle. Sign release with debug keystore
      # so the APK installs on any device without a custom upload keystore.
      - name: Force release buildType to use debug signing
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          APP_GRADLE="app/build.gradle"
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE="app/build.gradle.kts"
          fi
          echo "Patching $APP_GRADLE for debug-signed release..."

          if [ -f app/build.gradle ]; then
            # Groovy: ensure release uses signingConfigs.debug
            python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          text = p.read_text()
          if "signingConfig signingConfigs.debug" in text and "release" in text:
              # Already may reference debug in places; force inside release block
              import re
              def fix_release(m):
                  block = m.group(0)
                  if "signingConfig" in block:
                      block = re.sub(r"signingConfig\s+[^\n]+", "signingConfig signingConfigs.debug", block)
                  else:
                      block = block.replace("{", "{\n            signingConfig signingConfigs.debug", 1)
                  return block
              text2 = re.sub(
                  r"release\s*\{[^}]*\}",
                  fix_release,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              p.write_text(text2)
              print("Patched Groovy release signingConfig -> debug")
          else:
              print("app/build.gradle not found, skip groovy patch")
          PY
          elif [ -f app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle.kts")
          text = p.read_text()
          # Kotlin DSL: signingConfig = signingConfigs.getByName("debug")
          def fix_release(m):
              block = m.group(0)
              if "signingConfig" in block:
                  block = re.sub(
                      r"signingConfig\s*=\s*[^\n]+",
                      'signingConfig = signingConfigs.getByName("debug")',
                      block,
                  )
              else:
                  block = block.replace("{", '{\n            signingConfig = signingConfigs.getByName("debug")', 1)
              return block
          text2 = re.sub(r"release\s*\{[^}]*\}", fix_release, text, count=1, flags=re.DOTALL)
          p.write_text(text2)
          print("Patched Kotlin release signingConfig -> debug")
          PY
          else
            echo "WARNING: could not find app/build.gradle(.kts) to patch signing"
            ls -la app/ || true
          fi

      - name: Build RELEASE APK (embeds JS bundle — no Metro needed)
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          chmod +x gradlew
          # Release packages index.android.bundle into the APK
          ./gradlew assembleRelease --stacktrace --no-daemon
          echo "== APK search =="
          find . -name "*.apk" -type f

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-panchayat-cashbook-standalone-apk
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-build-logs
          path: |
            ${{ env.PROJECT_DIR }}/android/**/build/reports/**
            ${{ env.PROJECT_DIR }}/android/**/build/outputs/**
          retention-days: 7
          if-no-files-found: ignore
          
