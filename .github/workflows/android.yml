name: Build Expo Standalone APK

# Expo / React Native ZIP at repo root → standalone APK (JS embedded, no Metro).
# assembleRelease → RN Gradle plugin embeds JS. Signed with generated debug keystore.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          ls -la

          ZIP=$(find . -maxdepth 1 -type f \( \
            -iname '*Gram-Panchayat*.zip' -o \
            -iname '*cashbook*.zip' -o \
            -iname '*source*.zip' -o \
            -iname '*MVP*.zip' \
          \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi
          echo "Found ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -f extracted/cashbook-mobile/package.json ]; then
            PROJECT_DIR=extracted/cashbook-mobile
          elif [ -f extracted/package.json ] && [ -f extracted/app.json ]; then
            PROJECT_DIR=extracted
          else
            PROJECT_DIR=$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: Could not locate Expo project (package.json)."
            find extracted -type f | head -60
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      # Critical: Replit monorepo used "catalog:" / "workspace:*" versions.
      # Removing catalog packages broke the bundle (@tanstack/react-query is imported).
      # Replace catalog: with real npm versions; only drop internal @workspace/* packages.
      - name: Sanitize package.json for standalone CI
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // Known catalog: pins used by this project (add more if bundle reports missing modules)
          const CATALOG = {
            '@tanstack/react-query': '^5.62.8',
            'zod': '^3.24.1',
          };

          function fixDeps(deps, label) {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;

              // Internal monorepo package — not published; drop (app source does not import it)
              if (ver.startsWith('workspace:') || name.startsWith('@workspace/')) {
                console.log(`[${label}] drop workspace package: ${name}@${ver}`);
                continue;
              }

              if (ver === 'catalog:' || ver.startsWith('catalog:')) {
                const pinned = CATALOG[name];
                if (!pinned) {
                  console.log(`[${label}] WARNING: no pin for catalog package ${name}, using latest`);
                  out[name] = 'latest';
                } else {
                  console.log(`[${label}] catalog ${name} -> ${pinned}`);
                  out[name] = pinned;
                }
                continue;
              }

              out[name] = ver;
            }
            return out;
          }

          pkg.dependencies = fixDeps(pkg.dependencies, 'dependencies');
          pkg.devDependencies = fixDeps(pkg.devDependencies, 'devDependencies');
          delete pkg.packageManager;

          // Ensure react-query is present even if only listed under devDependencies
          // (Metro resolves from node_modules either way after install)
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Sanitized package.json written');
          NODE

      - name: Install JS dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          pnpm install --no-frozen-lockfile || npm install
          # Prove critical module is resolvable before native build
          node -e "require.resolve('@tanstack/react-query'); console.log('react-query OK')"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools cmdline-tools.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Expo prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npx expo prebuild --platform android --clean --no-install
          ls -la android

      - name: Re-sanitize + re-install after prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const CATALOG = {
            '@tanstack/react-query': '^5.62.8',
            'zod': '^3.24.1',
          };
          function fixDeps(deps) {
            if (!deps) return deps;
            const out = {};
            for (const [name, ver] of Object.entries(deps)) {
              if (typeof ver !== 'string') continue;
              if (ver.startsWith('workspace:') || name.startsWith('@workspace/')) continue;
              if (ver === 'catalog:' || ver.startsWith('catalog:')) {
                out[name] = CATALOG[name] || 'latest';
                continue;
              }
              out[name] = ver;
            }
            return out;
          }
          pkg.dependencies = fixDeps(pkg.dependencies);
          pkg.devDependencies = fixDeps(pkg.devDependencies);
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile || npm install
          node -e "require.resolve('@tanstack/react-query'); console.log('react-query OK after prebuild')"

      - name: Create debug keystore for release signing
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore debug-release.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build RELEASE APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -eo pipefail
          chmod +x gradlew

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/debug-release.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --stacktrace --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          echo "== All APK files =="
          find . -name "*.apk" -type f -print || true

      - name: Locate APK and copy to known path
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/apk-out"

          APK=$(find . -path "*/outputs/apk/*" -name "*.apk" -type f | grep -E 'release' | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced. Tail of gradle log:"
            tail -n 100 "$GITHUB_WORKSPACE/gradle-build.log" || true
            find . -path "*/build/outputs/*" -type f | head -80 || true
            exit 1
          fi

          echo "Found APK: $APK"
          cp -v "$APK" "$GITHUB_WORKSPACE/apk-out/gram-panchayat-cashbook.apk"
          ls -la "$GITHUB_WORKSPACE/apk-out/"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: gram-panchayat-cashbook-standalone-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            ${{ github.workspace }}/gradle-build.log
            ${{ env.PROJECT_DIR }}/android/**/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
          
